{% extends 'base.html' %}

{% block title %}Reservar turno - SIRCA{% endblock %}

{% block content %}
<div class="hero-pattern min-h-screen py-12 px-4 sm:px-6 lg:px-8 pt-28">
    <div class="max-w-6xl mx-auto">
        <div class="text-center mb-8">
            <p class="text-bordo-700 font-semibold tracking-wide uppercase text-sm mb-2">
                Reservá tu lugar
            </p>
            <h1 class="font-heading text-3xl md:text-4xl font-bold text-gray-900">
                Calendario de clases
            </h1>
        </div>

        <!-- Filtros -->
        <div class="bg-white shadow-lg rounded-2xl p-6 mb-6 border border-gray-100">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[200px]">
                    <label for="filtro-actividad" class="block text-sm font-medium text-gray-700 mb-1">Actividad</label>
                    <select id="filtro-actividad" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-bordo-500 focus:border-bordo-500">
                        <option value="">Todas las actividades</option>
                        {% for actividad in actividades %}
                            <option value="{{ actividad.id }}">{{ actividad.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="flex-1 min-w-[200px]">
                    <label for="filtro-profesor" class="block text-sm font-medium text-gray-700 mb-1">Profesor</label>
                    <select id="filtro-profesor" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-bordo-500 focus:border-bordo-500">
                        <option value="">Todos los profesores</option>
                        {% for profesor in profesores %}
                            <option value="{{ profesor.id }}">{{ profesor.nombre }} {{ profesor.apellido }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="flex-1 min-w-[150px]">
                    <label for="filtro-horario" class="block text-sm font-medium text-gray-700 mb-1">Horario</label>
                    <select id="filtro-horario" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-bordo-500 focus:border-bordo-500">
                        <option value="">Todos los horarios</option>
                        <option value="7">7hs</option>
                        <option value="8">8hs</option>
                        <option value="9">9hs</option>
                        <option value="10">10hs</option>
                        <option value="11">11hs</option>
                        <option value="12">12hs</option>
                        <option value="13">13hs</option>
                        <option value="14">14hs</option>
                        <option value="15">15hs</option>
                        <option value="16">16hs</option>
                        <option value="17">17hs</option>
                        <option value="18">18hs</option>
                        <option value="19">19hs</option>
                        <option value="20">20hs</option>
                        <option value="21">21hs</option>
                        <option value="22">22hs</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[140px]">
                    <label for="filtro-fecha-desde" class="block text-sm font-medium text-gray-700 mb-1">Fecha desde</label>
                    <input type="date" id="filtro-fecha-desde"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-bordo-500 focus:border-bordo-500">
                </div>
                <div class="flex-1 min-w-[140px]">
                    <label for="filtro-fecha-hasta" class="block text-sm font-medium text-gray-700 mb-1">Fecha hasta</label>
                    <input type="date" id="filtro-fecha-hasta"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-bordo-500 focus:border-bordo-500">
                </div>
                <div class="flex gap-2">
                    <button onclick="aplicarFiltros()" class="btn-bordo px-6 py-2.5 rounded-xl font-semibold">
                        Filtrar
                    </button>
                    <button onclick="limpiarFiltros()" id="btn-limpiar-filtros"
                            class="px-6 py-2.5 text-sm font-semibold rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors hidden">
                        Limpiar filtros
                    </button>
                </div>
            </div>
        </div>

        <!-- Mensaje cuando no hay actividades -->
        <div id="mensaje-vacio" class="hidden bg-white shadow-lg rounded-2xl p-8 mb-6 border border-gray-100 text-center">
            <svg class="mx-auto h-12 w-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <p id="mensaje-vacio-texto" class="text-gray-600"></p>
        </div>

        <!-- Calendario -->
        <div id="calendario-container" class="bg-white shadow-lg rounded-2xl border border-gray-100 overflow-hidden">
            <!-- Header del calendario -->
            <div class="flex items-center justify-between p-4 border-b border-gray-100">
                <button id="btn-mes-anterior" onclick="cambiarMes(-1)" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <h2 id="mes-actual" class="font-heading text-xl font-semibold text-gray-900"></h2>
                <button id="btn-mes-siguiente" onclick="cambiarMes(1)" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>

            <!-- Días de la semana -->
            <div class="grid grid-cols-7 border-b border-gray-100">
                <div class="p-3 text-center text-sm font-medium text-gray-500">Lun</div>
                <div class="p-3 text-center text-sm font-medium text-gray-500">Mar</div>
                <div class="p-3 text-center text-sm font-medium text-gray-500">Mié</div>
                <div class="p-3 text-center text-sm font-medium text-gray-500">Jue</div>
                <div class="p-3 text-center text-sm font-medium text-gray-500">Vie</div>
                <div class="p-3 text-center text-sm font-medium text-gray-500">Sáb</div>
                <div class="p-3 text-center text-sm font-medium text-gray-500">Dom</div>
            </div>

            <!-- Grid del calendario -->
            <div id="calendario-grid" class="grid grid-cols-7">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

        <!-- Leyenda -->
        <div class="mt-4 flex items-center gap-6 text-sm text-gray-600">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-bordo-500"></span>
                <span>Clases disponibles</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-gray-300"></span>
                <span>Sin clases</span>
            </div>
        </div>
    </div>
</div>

<!-- Panel lateral -->
<div id="panel-lateral" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50">
    <div class="h-full flex flex-col">
        <!-- Header del panel -->
        <div class="p-4 border-b border-gray-100">
            <div class="flex items-center justify-between mb-3">
                <h3 id="panel-titulo" class="font-heading text-lg font-semibold text-gray-900"></h3>
                <button onclick="cerrarPanel()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <!-- Filtro por actividad en el panel -->
            <div id="filtro-panel-container" class="hidden">
                <select id="filtro-panel-actividad" onchange="filtrarClasesPanel()" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-bordo-500 focus:border-bordo-500">
                    <option value="">Todas las actividades</option>
                </select>
            </div>
        </div>

        <!-- Contenido del panel -->
        <div id="panel-contenido" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Se llena dinámicamente -->
        </div>
    </div>
</div>

<!-- Overlay -->
<div id="overlay" onclick="cerrarPanel()" class="fixed inset-0 bg-black bg-opacity-25 hidden z-40"></div>

<style>
    .bordo-500 { background-color: #7a1d3a; }
    .calendar-day {
        min-height: 80px;
        border: 1px solid #f3f4f6;
        transition: all 0.15s ease;
    }
    .calendar-day:hover:not(.calendar-day-disabled) {
        background-color: #fdf2f4;
    }
    .calendar-day-today {
        background-color: #fef3f5;
    }
    .calendar-day-selected {
        background-color: #fde8ec;
        border-color: #7a1d3a;
    }
    .calendar-day-disabled {
        background-color: #f9fafb;
        color: #9ca3af;
    }
    .calendar-day-has-classes {
        cursor: pointer;
    }
    .clase-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #7a1d3a;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

let currentYear = {{ year }};
let currentMonth = {{ month }};
let clasesData = {};
let selectedDate = null;
let clasesPanelActual = [];

document.addEventListener('DOMContentLoaded', () => {
    cargarCalendario();
});

async function cargarCalendario() {
    const actividad = document.getElementById('filtro-actividad').value;
    const profesor = document.getElementById('filtro-profesor').value;
    const horario = document.getElementById('filtro-horario').value;
    const fechaDesde = document.getElementById('filtro-fecha-desde').value;
    const fechaHasta = document.getElementById('filtro-fecha-hasta').value;

    // Validación frontend: fecha_desde no puede ser mayor a fecha_hasta
    if (fechaDesde && fechaHasta && fechaDesde > fechaHasta) {
        Swal.fire({
            icon: 'error',
            title: 'Fechas inválidas',
            text: 'La fecha "desde" no puede ser mayor a la fecha "hasta"',
            confirmButtonColor: '#8b1c26'
        });
        return;
    }

    let url = `/turno/api/calendario/?year=${currentYear}&month=${currentMonth}`;
    if (actividad) url += `&actividad=${actividad}`;
    if (profesor) url += `&profesor=${profesor}`;
    if (horario) url += `&horario=${horario}`;
    if (fechaDesde) url += `&fecha_desde=${fechaDesde}`;
    if (fechaHasta) url += `&fecha_hasta=${fechaHasta}`;

    try {
        const response = await fetch(url);
        const data = await response.json();
        clasesData = data.dias;

        // Mostrar mensaje vacío si corresponde
        const mensajeVacio = document.getElementById('mensaje-vacio');
        const mensajeTexto = document.getElementById('mensaje-vacio-texto');
        const calendarioContainer = document.getElementById('calendario-container');

        if (data.mensaje_vacio) {
            mensajeTexto.textContent = data.mensaje_vacio;
            mensajeVacio.classList.remove('hidden');
            calendarioContainer.classList.add('hidden');
        } else {
            mensajeVacio.classList.add('hidden');
            calendarioContainer.classList.remove('hidden');
        }

        actualizarEstadoNavegacion();
        renderizarCalendario();
    } catch (error) {
        console.error('Error cargando calendario:', error);
    }
}

function renderizarCalendario() {
    document.getElementById('mes-actual').textContent = `${MESES[currentMonth - 1]} ${currentYear}`;

    const grid = document.getElementById('calendario-grid');
    grid.innerHTML = '';

    const primerDia = new Date(currentYear, currentMonth - 1, 1);
    const ultimoDia = new Date(currentYear, currentMonth, 0);
    const diasEnMes = ultimoDia.getDate();

    let primerDiaSemana = primerDia.getDay();
    primerDiaSemana = primerDiaSemana === 0 ? 6 : primerDiaSemana - 1;

    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);

    for (let i = 0; i < primerDiaSemana; i++) {
        const celda = document.createElement('div');
        celda.className = 'calendar-day calendar-day-disabled';
        grid.appendChild(celda);
    }

    for (let dia = 1; dia <= diasEnMes; dia++) {
        const fecha = new Date(currentYear, currentMonth - 1, dia);
        const fechaStr = fecha.toISOString().split('T')[0];
        const clases = clasesData[fechaStr] || [];
        const esPasado = fecha < hoy;
        const esHoy = fecha.getTime() === hoy.getTime();
        const esSeleccionado = selectedDate === fechaStr;

        const celda = document.createElement('div');
        celda.className = 'calendar-day p-2';

        if (esPasado) {
            celda.classList.add('calendar-day-disabled');
        } else if (esHoy) {
            celda.classList.add('calendar-day-today');
        }

        if (esSeleccionado) {
            celda.classList.add('calendar-day-selected');
        }

        if (clases.length > 0 && !esPasado) {
            celda.classList.add('calendar-day-has-classes');
            celda.onclick = () => abrirPanel(fechaStr, clases);
        }

        celda.innerHTML = `
            <div class="text-sm font-medium ${esPasado ? 'text-gray-400' : 'text-gray-900'}">${dia}</div>
            ${clases.length > 0 ? `
                <div class="flex flex-wrap gap-1 mt-1">
                    ${clases.slice(0, 4).map(() => '<span class="clase-dot"></span>').join('')}
                    ${clases.length > 4 ? `<span class="text-xs text-gray-500">+${clases.length - 4}</span>` : ''}
                </div>
            ` : ''}
        `;

        grid.appendChild(celda);
    }

    const celdasRestantes = 42 - (primerDiaSemana + diasEnMes);
    for (let i = 0; i < celdasRestantes && (primerDiaSemana + diasEnMes + i) < 42; i++) {
        const celda = document.createElement('div');
        celda.className = 'calendar-day calendar-day-disabled';
        grid.appendChild(celda);
    }
}

function cambiarMes(delta) {
    currentMonth += delta;
    if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
    } else if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
    }
    selectedDate = null;
    cargarCalendario();
}

function aplicarFiltros() {
    actualizarBotonLimpiar();
    cargarCalendario();
}

function limpiarFiltros() {
    document.getElementById('filtro-actividad').value = '';
    document.getElementById('filtro-profesor').value = '';
    document.getElementById('filtro-horario').value = '';
    document.getElementById('filtro-fecha-desde').value = '';
    document.getElementById('filtro-fecha-hasta').value = '';
    actualizarBotonLimpiar();
    actualizarEstadoNavegacion();
    cargarCalendario();
}

function actualizarBotonLimpiar() {
    const actividad = document.getElementById('filtro-actividad').value;
    const profesor = document.getElementById('filtro-profesor').value;
    const horario = document.getElementById('filtro-horario').value;
    const fechaDesde = document.getElementById('filtro-fecha-desde').value;
    const fechaHasta = document.getElementById('filtro-fecha-hasta').value;
    const btn = document.getElementById('btn-limpiar-filtros');

    if (actividad || profesor || horario || fechaDesde || fechaHasta) {
        btn.classList.remove('hidden');
    } else {
        btn.classList.add('hidden');
    }
}

function actualizarEstadoNavegacion() {
    const fechaDesde = document.getElementById('filtro-fecha-desde').value;
    const fechaHasta = document.getElementById('filtro-fecha-hasta').value;
    const hayFiltroFechas = fechaDesde || fechaHasta;

    const btnAnterior = document.getElementById('btn-mes-anterior');
    const btnSiguiente = document.getElementById('btn-mes-siguiente');

    if (hayFiltroFechas) {
        btnAnterior.disabled = true;
        btnSiguiente.disabled = true;
        btnAnterior.classList.add('opacity-50', 'cursor-not-allowed');
        btnSiguiente.classList.add('opacity-50', 'cursor-not-allowed');
    } else {
        btnAnterior.disabled = false;
        btnSiguiente.disabled = false;
        btnAnterior.classList.remove('opacity-50', 'cursor-not-allowed');
        btnSiguiente.classList.remove('opacity-50', 'cursor-not-allowed');
    }
}

function abrirPanel(fecha, clases) {
    selectedDate = fecha;
    clasesPanelActual = clases;
    renderizarCalendario();

    const fechaObj = new Date(fecha + 'T00:00:00');
    const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
    const fechaFormateada = fechaObj.toLocaleDateString('es-AR', opciones);

    document.getElementById('panel-titulo').textContent = fechaFormateada.charAt(0).toUpperCase() + fechaFormateada.slice(1);

    // Poblar filtro de actividades del panel
    const filtroContainer = document.getElementById('filtro-panel-container');
    const filtroSelect = document.getElementById('filtro-panel-actividad');
    const actividadesUnicas = [...new Set(clases.map(c => c.actividad))];

    if (actividadesUnicas.length > 1) {
        filtroSelect.innerHTML = '<option value="">Todas las actividades</option>' +
            actividadesUnicas.map(a => `<option value="${a}">${a}</option>`).join('');
        filtroContainer.classList.remove('hidden');
    } else {
        filtroContainer.classList.add('hidden');
    }

    renderizarClasesPanel(clases);

    document.getElementById('panel-lateral').classList.remove('translate-x-full');
    document.getElementById('overlay').classList.remove('hidden');
}

function filtrarClasesPanel() {
    const filtro = document.getElementById('filtro-panel-actividad').value;
    const clasesFiltradas = filtro
        ? clasesPanelActual.filter(c => c.actividad === filtro)
        : clasesPanelActual;
    renderizarClasesPanel(clasesFiltradas);
}

function renderizarClasesPanel(clases) {
    const contenido = document.getElementById('panel-contenido');

    if (clases.length === 0) {
        contenido.innerHTML = `
            <div class="text-center py-8 text-gray-500">
                <svg class="mx-auto h-12 w-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <p>No hay clases disponibles</p>
            </div>
        `;
    } else {
        contenido.innerHTML = clases.map(clase => `
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
                <div class="flex items-start justify-between mb-3">
                    <h4 class="font-heading font-semibold text-bordo-700">${clase.actividad}</h4>
                    <span class="px-2 py-1 text-xs font-medium rounded-full ${clase.cupos > 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                        ${clase.cupos > 0 ? `${clase.cupos} cupos` : 'Sin cupos'}
                    </span>
                </div>
                <div class="space-y-1.5 text-sm text-gray-600 mb-4">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-bordo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span>${clase.hora_inicio} - ${clase.hora_fin}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-bordo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span>${clase.profesor}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-bordo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <span>${clase.salon}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-bordo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span>$${clase.precio}</span>
                    </div>
                </div>
                <a href="/turno/clases/${clase.id}/" class="block w-full text-center btn-bordo py-2.5 rounded-xl font-semibold text-sm">
                    Ver detalle
                </a>
            </div>
        `).join('');
    }
}

function cerrarPanel() {
    selectedDate = null;
    renderizarCalendario();
    document.getElementById('panel-lateral').classList.add('translate-x-full');
    document.getElementById('overlay').classList.add('hidden');
}
</script>
{% endblock %}
